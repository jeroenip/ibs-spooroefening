<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Spoorcrisis IBS-oefening</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: een crisislogboek. Eén kolom, donkere kopband met rode lijn, signalen als logregels met een IBS-keuze eronder. */
:root{
  --bg:#F4F4F6; --surface:#FFFFFF; --ink:#2C2A3B; --muted:#5F5D70; --line:#D6D5DE;
  --accent:#B20A2F; --accent-ink:#FFFFFF;
  --band:#2C2A3B; --band-ink:#FFFFFF; --band-muted:#CFCDDC;
  --i:#1F56A8; --i-bg:#E4ECF8; --s:#8A5200; --s-bg:#FAEEDA; --b:#5B3A8C; --b-bg:#ECE5F6;
  --ok:#1B7A43; --bad:#B20A2F;
  --display:Museo,"Zilla Slab",Rockwell,Georgia,serif;
  --body:Frutiger,Roboto,Arial,sans-serif;
  --mono:Frutiger,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A1924; --surface:#2C2A3B; --ink:#F1F0F5; --muted:#ABA9BC; --line:#45435A;
  --accent:#FF6B86; --accent-ink:#1A1924;
  --band:#0F0E16; --band-ink:#FFFFFF; --band-muted:#BDBBCD;
  --i:#8DB4F2; --i-bg:#1F3050; --s:#F0B45A; --s-bg:#43310F; --b:#C5A8F0; --b-bg:#3A2A58;
  --ok:#5FD08B; --bad:#FF8A9C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1A1924; --surface:#2C2A3B; --ink:#F1F0F5; --muted:#ABA9BC; --line:#45435A;
  --accent:#FF6B86; --accent-ink:#1A1924;
  --band:#0F0E16; --band-ink:#FFFFFF; --band-muted:#BDBBCD;
  --i:#8DB4F2; --i-bg:#1F3050; --s:#F0B45A; --s-bg:#43310F; --b:#C5A8F0; --b-bg:#3A2A58;
  --ok:#5FD08B; --bad:#FF8A9C; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px 64px}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:700}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0;max-width:65ch}
.mono{font-family:var(--mono);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero{background:var(--band);color:var(--band-ink);padding:24px;border-bottom:6px solid var(--accent);border-radius:3px 3px 0 0}
.hero .mono,.hero .lead{color:var(--band-muted)}
.foot{color:var(--muted);font-size:.875rem;border-top:1px solid var(--line);padding-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.lead{color:var(--muted);font-size:1.05rem}

.ibs-key{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ibs-key div{padding:12px;border-radius:3px;min-width:0}
.ibs-key strong{display:block;font-family:var(--display);font-size:1rem}
.ibs-key span{font-size:.9rem}
.k-I{background:var(--i-bg);color:var(--i)} .k-S{background:var(--s-bg);color:var(--s)} .k-B{background:var(--b-bg);color:var(--b)}
@media (max-width:560px){.ibs-key{grid-template-columns:1fr}}

fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{padding:0;margin-bottom:8px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.opt small{color:var(--muted);font-size:.875rem}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.btn{font:600 1rem var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;padding:12px 20px;cursor:pointer;align-self:flex-start}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:2px solid var(--ink);padding-block:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;z-index:2}
.sit{border-left:4px solid var(--ink);padding-left:16px}

.log{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sig{padding-block:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sig q{quotes:"“" "”";font-size:1.05rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font:500 .9rem var(--body);padding:8px 4px;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.seg button[aria-pressed="true"].l-I{background:var(--i-bg);border-color:var(--i);color:var(--i);font-weight:600}
.seg button[aria-pressed="true"].l-S{background:var(--s-bg);border-color:var(--s);color:var(--s);font-weight:600}
.seg button[aria-pressed="true"].l-B{background:var(--b-bg);border-color:var(--b);color:var(--b);font-weight:600}
.seg button:disabled{cursor:default}
.seg button.right{outline:2px solid var(--ok);outline-offset:1px}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.why{color:var(--muted);font-size:.95rem}

textarea{width:100%;min-height:150px;font:inherit;padding:12px;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.model{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px}
.model dl{margin:0;display:flex;flex-direction:column;gap:10px}
.model dt{font-family:var(--display);font-weight:600}
.model dd{margin:0}
.t-I{color:var(--i)} .t-S{color:var(--s)} .t-B{color:var(--b)}
.mine{border-left:4px solid var(--accent);padding-left:12px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
details summary{cursor:pointer;font-weight:600}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.score div{padding:12px;border-radius:3px;background:var(--surface);border:1px solid var(--line)}
.score b{font-family:var(--display);font-size:1.75rem;display:block;font-variant-numeric:tabular-nums}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
</style>

<div id="app"></div>

<script>
const IBS={
  I:{naam:'Informatiebehoefte',kort:'Informatie',vraag:'Wat is er aan de hand? Wat weten we, wat nog niet?'},
  S:{naam:'Schadebeperking',kort:'Schade­beperking',vraag:'Wat moet ik doen of laten? Handelingsperspectief.'},
  B:{naam:'Betekenisgeving',kort:'Betekenis',vraag:'Wat betekent dit voor ons? Emotie, duiding, vertrouwen.'}
};
const ROLLEN={
  adv:{naam:'Communicatieadviseur',taak:'Adviseert het crisisteam over strategie en kernboodschap.',vraag:'Wat adviseer je het crisisteam nu? Geef per I, S en B je kernboodschap en je belangrijkste strategische keuze.',
    check:['Ik geef één duidelijk advies dat het team direct kan besluiten','Ik benoem wat we nog niet weten en hoe we daarmee omgaan','Ik noem een volgend updatemoment of vervolgstap']},
  wv:{naam:'Woordvoerder',taak:'Staat de pers te woord en bewaakt de woordvoeringslijn.',vraag:'Wat zeg je nu tegen de pers, en wat uitdrukkelijk nog niet? Schrijf je woordvoeringslijn.',
    check:['Mijn lijn bevat alleen bevestigde feiten','Ik speculeer niet over oorzaak of schuld','Ik toon eerst betrokkenheid, daarna de feiten']},
  oa:{naam:'Omgevingsanalist',taak:'Duidt media en sociale media en maakt het omgevingsbeeld.',vraag:'Wat is je omgevingsbeeld? Wat leeft er per I, S en B, bij wie, en wat verwacht je het komende uur?',
    check:['Ik onderscheid feiten, vragen en sentiment','Ik benoem welke groepen wat nodig hebben','Ik kijk vooruit: wat komt er op ons af?']},
  pa:{naam:'Public affairs-adviseur',taak:'Houdt bestuurders, politiek en ministerie aangehaakt.',vraag:'Welke bestuurders en politici informeer je, in welke volgorde en met welke boodschap?',
    check:['Bestuurders horen het van ons vóór ze het in de media lezen','Mijn boodschap is feitelijk en gelijk aan de perslijn','Ik benoem het politieke risico dat ik zie']},
  red:{naam:'Redacteur',taak:'Schrijft en publiceert berichten op web, sociale media en intern.',vraag:'Welke berichten publiceer je nu, op welke kanalen en voor wie? Schrijf je belangrijkste bericht uit.',
    check:['Er is één bron waar alle berichten naar verwijzen','Mijn bericht is begrijpelijk en heeft een tijdstempel','Medewerkers lezen het intern niet later dan de buitenwereld']}
};
const RK=Object.keys(ROLLEN);
// signaal: [bron, afzender, tekst, label, uitleg]
const SCEN=[
{id:'ontsporing',titel:'Ontsporing goederentrein bij Lindewijk',kort:'Een ketelwagen met ethanol lekt vlak bij de dorpskern.',rondes:[
 {tijd:'05.30 uur · T+0.40',sit:'Om 04.50 uur is een goederentrein ontspoord bij het dorp Lindewijk. Eén ketelwagen met ethanol lekt. Er zijn geen gewonden. De brandweer heeft een gebied van 500 meter afgezet. Er rijden geen treinen tussen Lindewijk en Merwedam.',
  sig:[
   ['Sociale media','Bewoner','Enorme knal bij het spoor in Lindewijk, overal zwaailichten. Wat is er gebeurd??','I','Een pure feitenvraag: wat is er aan de hand?'],
   ['Publieksnummer','Bewoner Spoorlaan','Ik woon aan de Spoorlaan. Moet ik ramen en deuren dichthouden? Kunnen de kinderen straks naar school?','S','De beller vraagt wat hij moet doen of laten: handelingsperspectief.'],
   ['Pers','Regionale omroep','Klopt het dat er gevaarlijke stoffen in de wagons zaten, en welke?','I','De journalist wil feiten bevestigd krijgen.'],
   ['Sociale media','Buurtgroep Lindewijk','Dit is de derde keer dat het hier misgaat. Wij zijn blijkbaar minder waard dan een goederentrein.','B','Hier wordt geen vraag gesteld. Het gaat om boosheid en het gevoel niet gezien te worden.'],
   ['Klantenservice','Reiziger','Mijn trein van 6.12 uur rijdt niet. Moet ik omreizen of kan ik beter thuisblijven?','S','De reiziger zoekt een keuze die hij zelf kan maken om de gevolgen te beperken.']],
  adv:{I:'Meld wat vaststaat: goederentrein ontspoord om 04.50 uur, één ketelwagen lekt ethanol, geen gewonden. Zeg ook wat je nog niet weet en wanneer de volgende update komt.',
   S:'Eén handelingsperspectief, afgestemd met de veiligheidsregio: binnen 500 meter ramen en deuren dicht en volg de regionale crisiskanalen. Reizigers: geen treinen tussen Lindewijk en Merwedam, kijk in de reisplanner.',
   B:'Erken de schrik in het dorp en het gevoel dat het hier vaker misgaat. Nog niets verdedigen of verklaren. Laat zien dat de directie betrokken is.'},
  rol:{adv:'Spreek een vaste updatecadans af en laat de veiligheidsregio leidend zijn op het handelingsperspectief, zodat er één boodschap klinkt.',
   wv:'Korte verklaring: feiten, medeleven met omwonenden, volgend updatemoment. De lading bevestig je pas als die is geverifieerd. Niets over de oorzaak.',

 {tijd:'08.00 uur · T+3.10',sit:'Het lek is gedicht. Uit voorzorg zijn 120 woningen ontruimd; bewoners worden opgevangen in de sporthal. Metingen laten geen gevaarlijke concentraties zien. De oorzaak is onbekend.',
  sig:[

   ['Publieksnummer','Moeder','Mijn dochter heeft astma en we hebben die lucht ingeademd. Moeten we naar de huisarts?','S','Zij wil weten wat ze moet doen om gezondheidsschade te voorkomen.'],

  adv:{I:'Lek gedicht, 120 woningen uit voorzorg ontruimd, metingen tonen geen gevaarlijke concentraties. Oorzaak wordt onderzocht. Geef een eerlijke verwachting over de duur van de ontruiming, ook als die nog onzeker is.',

  rol:{adv:'Adviseer nu zichtbaar aanwezig te zijn in het dorp. Betekenisgeving vraagt een gezicht, niet alleen een bericht.',

 {tijd:'Volgende dag, 10.00 uur',sit:'Bewoners zijn terug in hun huis. Het spoor blijft nog vijf dagen dicht voor berging en herstel. Een onafhankelijk onderzoek naar de oorzaak is gestart.',

  adv:{I:'Spoor vijf dagen dicht, onafhankelijk onderzoek gestart, uitkomsten worden gedeeld. Lever feiten over transporten aan via het ministerie.',

  rol:{adv:'Schuif van crisis naar nafase: maak een plan voor de komende weken met vaste contactmomenten voor het dorp.',

 {tijd:'19.00 uur · T+2.20',sit:'De oorzaak is gevonden: een mislukte software-update. Het is geen hack. De gestrande treinen zijn geëvacueerd. Het herstarten duurt zeker tot 22.00 uur. Het reservesysteem is niet goed opgestart.',

 {tijd:'Volgende dag, 09.30 uur',sit:'De overweg gaat morgen weer open. Bij de overweg liggen bloemen. Vrijdag is er een stille tocht. Een onafhankelijk onderzoek loopt.',
  sig:[
   ['E-mail','Organisator stille tocht','Er liggen bloemen bij de overweg. Komt er vrijdag iemand van het spoor meelopen?','B','Een uitnodiging om mee te rouwen: betekenisgeving in de zuiverste vorm.'],
   ['Pers','Journalist','Wanneer komt het onderzoek met de eerste bevindingen?','I','Feitenvraag over proces en planning.'],

let st={view:'start',scen:null,rol:'adv',modus:'solo',r:0,stap:'label',lab:{},note:{},chk:{}};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S=()=>SCEN[st.scen], R=()=>S().rondes[st.r];
const labs=r=>st.lab[r]||(st.lab[r]={});
const checks=r=>st.chk[r]||(st.chk[r]=[false,false,false,false]);

function key(){return `<div class="ibs-key">${Object.entries(IBS).map(([k,v])=>`<div class="k-${k}"><strong>${k} · ${v.naam}</strong><span>${v.vraag}</span></div>`).join('')}</div>`}

function start(){
  return `<header class="stack hero"><span class="mono">Tabletop-oefening crisiscommunicatie · spoor</span>
  <h1>Spoorcrisis IBS-oefening</h1>
  <p class="lead">Je zit in het crisisteam van een fictieve spoorbeheerder. In drie rondes komen signalen binnen. Label elk signaal, schrijf je advies en vergelijk het met de uitwerking.</p></header>
  ${key()}
  <fieldset><legend><h3>Scenario</h3></legend><div class="opts">${SCEN.map((s,i)=>`<button class="opt" data-a="scen" data-v="${i}" aria-pressed="${st.scen===i}"><strong>${s.titel}</strong><small>${s.kort}</small></button>`).join('')}</div></fieldset>
  <fieldset><legend><h3>Spelvorm</h3></legend><div class="opts">
   <button class="opt" data-a="modus" data-v="solo" aria-pressed="${st.modus==='solo'}"><strong>Solo</strong><small>Je speelt één rol en schrijft zelf je advies.</small></button>
   <button class="opt" data-a="modus" data-v="groep" aria-pressed="${st.modus==='groep'}"><strong>Groep aan tafel</strong><small>Verdeel de vijf rollen, label samen en bespreek per rol het advies.</small></button></div></fieldset>
  ${st.modus==='solo'?`<fieldset><legend><h3>Jouw rol</h3></legend><div class="opts">${RK.map(k=>`<button class="opt" data-a="rol" data-v="${k}" aria-pressed="${st.rol===k}"><strong>${ROLLEN[k].naam}</strong><small>${ROLLEN[k].taak}</small></button>`).join('')}</div></fieldset>`
   :`<div class="stack"><h3>Rollen aan tafel</h3><ul>${RK.map(k=>`<li><strong>${ROLLEN[k].naam}.</strong> ${ROLLEN[k].taak}</li>`).join('')}</ul><p class="why">Met minder dan vijf spelers combineer je rollen. Eén speler leest de signalen voor en bedient het scherm.</p></div>`}
  <button class="btn" data-a="go" ${st.scen===null?'disabled':''}>Start de oefening</button>
  ${st.scen===null?'<p class="why">Kies eerst een scenario.</p>':''}`;
}

function ronde(){
  const r=R(),L=labs(st.r),done=st.stap!=='label',n=r.sig.length,filled=Object.keys(L).length;
  let h=`<div class="bar"><span class="mono">${esc(S().titel)}</span><span class="mono">Ronde ${st.r+1} van 3 · ${st.modus==='solo'?ROLLEN[st.rol].naam:'Groep'}</span></div>
  <section class="stack"><span class="mono">${r.tijd}</span><h2>Situatie</h2><p class="sit">${r.sit}</p></section>
  <section class="stack"><h2>Binnengekomen signalen</h2><p class="why">${done?'Bekijk per signaal de toelichting.':'Welke behoefte klinkt in elk signaal het sterkst door?'}</p>
  <div class="log">${r.sig.map((s,i)=>{
    const goed=L[i]===s[3];
    return `<div class="sig"><span class="mono">${s[0]} · ${s[1]}</span><q>${s[2]}</q>
    <div class="seg" role="group" aria-label="Label voor signaal ${i+1}">${['I','S','B'].map(k=>`<button class="l-${k}${done&&k===s[3]?' right':''}" data-a="lab" data-i="${i}" data-v="${k}" aria-pressed="${L[i]===k}" ${done?'disabled':''}>${IBS[k].kort}</button>`).join('')}</div>
    ${done?`<span class="verdict ${goed?'ok':'bad'}">${goed?'Goed':'Niet goed'}: ${IBS[s[3]].naam}</span><span class="why">${s[4]}</span>`:''}</div>`}).join('')}</div>
  ${!done?`<div class="row"><button class="btn" data-a="check" ${filled<n?'disabled':''}>Controleer labels</button><span class="why">${filled} van ${n} gelabeld</span></div>`
   :`<p><strong>${r.sig.filter((s,i)=>L[i]===s[3]).length} van ${n} goed.</strong></p>`}</section>`;
  if(done) h+=advies();
  return h;
}

function advies(){
  const r=R(),open=st.stap==='advfb',solo=st.modus==='solo',C=checks(st.r);
  const crit=solo?['Mijn advies dekt alle drie: I, S en B',...ROLLEN[st.rol].check]:['Ons advies dekt alle drie: I, S en B','Elke rol heeft een eigen bijdrage geleverd','Onze boodschappen spreken elkaar niet tegen','We hebben benoemd wat we nog niet weten'];
  let h=`<section class="stack"><h2>Advies aan het crisisteam</h2>`;
  if(solo) h+=`<p><strong>${ROLLEN[st.rol].naam}.</strong> ${ROLLEN[st.rol].vraag}</p>`;
  else h+=`<p>Neem vijf minuten. Elke rol beantwoordt de eigen vraag; leg het gezamenlijke advies hieronder vast.</p><ul>${RK.map(k=>`<li><strong>${ROLLEN[k].naam}:</strong> ${ROLLEN[k].vraag}</li>`).join('')}</ul>`;
  h+=`<label class="mono" for="note-${st.r}">${solo?'Jouw advies':'Advies van de tafel'}</label>
  <textarea id="note-${st.r}" data-a="note" placeholder="I: …&#10;S: …&#10;B: …">${esc(st.note[st.r]||'')}</textarea>`;
  if(!open) return h+`<button class="btn" data-a="reveal">Toon de uitwerking</button></section>`;
  h+=`<div class="model"><span class="mono">Uitwerking · zo kan het</span><dl>${['I','S','B'].map(k=>`<div><dt class="t-${k}">${IBS[k].naam}</dt><dd>${r.adv[k]}</dd></div>`).join('')}</dl>
  ${solo?`<div class="mine"><h3>Jouw bijdrage als ${ROLLEN[st.rol].naam.toLowerCase()}</h3><p>${r.rol[st.rol]}</p></div>
    <details><summary>Wat doen de andere rollen?</summary><dl style="margin-top:12px">${RK.filter(k=>k!==st.rol).map(k=>`<div><dt>${ROLLEN[k].naam}</dt><dd>${r.rol[k]}</dd></div>`).join('')}</dl></details>`
   :`<dl>${RK.map(k=>`<div><dt>${ROLLEN[k].naam}</dt><dd>${r.rol[k]}</dd></div>`).join('')}</dl>`}</div>
  <div class="stack"><h3>Zelfcheck</h3><p class="why">Vergelijk eerlijk met de uitwerking en vink aan wat klopt.</p>
  ${crit.map((c,i)=>`<label class="check" for="chk-${st.r}-${i}"><input type="checkbox" id="chk-${st.r}-${i}" data-a="chk" data-i="${i}" ${C[i]?'checked':''}><span>${c}</span></label>`).join('')}</div>
  <button class="btn" data-a="next">${st.r<2?'Naar ronde '+(st.r+2):'Naar de eindscore'}</button></section>`;
  return h;
}

function eind(){
  const tot={I:[0,0],S:[0,0],B:[0,0]},mis=[];
  S().rondes.forEach((r,ri)=>r.sig.forEach((s,i)=>{tot[s[3]][1]++;const g=(st.lab[ri]||{})[i];if(g===s[3])tot[s[3]][0]++;else mis.push([ri,s,g])}));
  const good=tot.I[0]+tot.S[0]+tot.B[0],all=tot.I[1]+tot.S[1]+tot.B[1];
  const zc=[0,1,2].reduce((a,r)=>a+checks(r).filter(Boolean).length,0);
  const zwak=Object.entries(tot).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1])[0];
  return `<header class="stack hero"><span class="mono">Eindscore · ${esc(S().titel)}</span><h1>${good} van ${all} signalen goed gelabeld</h1>
  <p class="lead">${good===all?'Alle signalen goed herkend.':`Het lastigst was ${IBS[zwak[0]].naam.toLowerCase()}: ${zwak[1][0]} van ${zwak[1][1]} herkend.`}</p></header>
  <div class="score">${Object.entries(tot).map(([k,v])=>`<div><span class="mono t-${k}">${IBS[k].naam}</span><b>${v[0]}/${v[1]}</b></div>`).join('')}<div><span class="mono">Zelfcheck advies</span><b>${zc}/12</b></div></div>
  ${mis.length?`<section class="stack"><h2>Nog eens bekijken</h2><div class="log">${mis.map(([ri,s,g])=>`<div class="sig"><span class="mono">Ronde ${ri+1} · ${s[0]} · ${s[1]}</span><q>${s[2]}</q><span class="verdict bad">Jij koos ${IBS[g].naam.toLowerCase()}, het is ${IBS[s[3]].naam.toLowerCase()}</span><span class="why">${s[4]}</span></div>`).join('')}</div></section>`:''}
  <section class="stack"><h2>Vuistregels</h2><ul>
   <li>Vraagt iemand <em>wat er aan de hand is</em>, dan is het informatiebehoefte. Ook een politicus of journalist kan een zuivere feitenvraag stellen.</li>
   <li>Vraagt iemand <em>wat hij moet doen of waar hij terechtkan</em>, dan is het schadebeperking.</li>
   <li>Staat er geen vraag maar een oordeel, emotie of verwijt, dan is het betekenisgeving.</li>
   <li>Een goed advies bedient alle drie, in de volgorde die de situatie vraagt. Bij gevaar gaat schadebeperking voor.</li></ul></section>
  <div class="row"><button class="btn" data-a="again">Speel een ander scenario of andere rol</button></div>`;
}

function render(top){
  app.innerHTML=(st.view==='start'?start():st.view==='eind'?eind():ronde())+'<p class="foot">Oefenmateriaal. De scenario’s, plaatsnamen en citaten zijn fictief.</p>';
  if(top) window.scrollTo(0,0);
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a,v=b.dataset.v; let top=false;
  if(a==='scen') st.scen=+v;
  else if(a==='modus') st.modus=v;
  else if(a==='rol') st.rol=v;
  else if(a==='go'){st.view='ronde';st.r=0;st.stap='label';st.lab={};st.note={};st.chk={};top=true}
  else if(a==='lab') labs(st.r)[+b.dataset.i]=v;
  else if(a==='check') st.stap='adv';
  else if(a==='reveal') st.stap='advfb';
  else if(a==='next'){ if(st.r<2){st.r++;st.stap='label'} else st.view='eind'; top=true }
  else if(a==='again'){st.view='start';top=true}
  render(top);
  if(a==='check') document.querySelector('.verdict')?.scrollIntoView({block:'center',behavior:'smooth'});
});
app.addEventListener('input',e=>{const t=e.target; if(t.dataset.a==='note') st.note[st.r]=t.value});
app.addEventListener('change',e=>{const t=e.target; if(t.dataset.a==='chk') checks(st.r)[+t.dataset.i]=t.checked});

function boot(d){ if(d&&d.view) st=Object.assign(st,d); render(); }
window.claude?.hot?.snapshot?.(()=>st);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
